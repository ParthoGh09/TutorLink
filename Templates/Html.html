{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="login-wrap">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue to your TutorLink account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.username }}
      {{ form.password }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn" type="submit">Log In</button>
    </form>
  </div>
</div>
{% endblock %}
