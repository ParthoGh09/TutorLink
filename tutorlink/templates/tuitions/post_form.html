
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Tuition Post Form" }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 28px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 24px;
            text-align: center;
            color: #1f2937;
        }

        form p {
            margin: 0 0 20px;
        }

        form p > label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input:not([type="checkbox"]):not([type="file"]),
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            background: #fff;
        }

        textarea {
            resize: vertical;
        }

        input[type="file"] {
            display: block;
            max-width: 100%;
            margin-top: 8px;
        }

        /* Image preview and Clear checkbox alignment */
        .form-container p:has(input[type="checkbox"][name$="-clear"]) {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .form-container p:has(input[type="checkbox"][name$="-clear"]) > label {
            margin-bottom: 0;
        }

        .form-container p:has(input[type="checkbox"][name$="-clear"]) a {
            display: inline-block;
            margin: 0 0 8px;
        }

        .form-container input[type="checkbox"][name$="-clear"] {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
            accent-color: #2563eb;
            vertical-align: middle;
        }

        .form-container input[type="checkbox"][name$="-clear"] + label {
            display: inline;
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            color: #4b5563;
            cursor: pointer;
        }

        .form-container p:has(input[type="checkbox"][name$="-clear"]) br {
            display: none;
        }

        .helptext {
            display: block;
            margin-top: 6px;
            color: #6b7280;
            font-size: 13px;
        }

        .errorlist {
            margin: 6px 0;
            padding-left: 20px;
            color: #dc2626;
            font-size: 14px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: #1d4ed8;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 20px 16px;
            }

            body {
                padding: 18px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>{{ title|default:"Create Tuition Post" }}</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Save Post</button>
        </form>
    </div>
</body>
</html>
