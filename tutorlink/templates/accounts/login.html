<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TutorLink</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1F2A5C',
                        indigoCustom: '#2E3C86'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 sm:p-8">

        <!-- Heading -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-navy">TutorLink</h1>
            <h2 class="text-xl font-semibold text-slate-800 mt-3">
                Sign In
            </h2>
            <p class="text-sm text-slate-500 mt-1">
                Enter your account details below.
            </p>
        </div>

        <!-- Django Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm
                    {% if message.tags == 'success' %}
                        bg-emerald-50 text-emerald-700 border border-emerald-200
                    {% else %}
                        bg-red-50 text-red-700 border border-red-200
                    {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <!-- Role Selection -->
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Login as
            </label>

            <div class="grid grid-cols-3 gap-2 mb-5">

                <!-- Student -->
                <label class="cursor-pointer">
                    <input
                        type="radio"
                        name="role"
                        value="STUDENT"
                        class="peer sr-only"
                        {% if selected_role == 'STUDENT' or not selected_role %}checked{% endif %}
                        required
                    >
                    <span class="block text-center border border-slate-200 rounded-lg p-3 text-sm
                        text-slate-700 hover:bg-slate-50
                        peer-checked:bg-navy peer-checked:text-white
                        peer-checked:border-navy">
                        👤 Student
                    </span>
                </label>

                <!-- Tutor -->
                <label class="cursor-pointer">
                    <input
                        type="radio"
                        name="role"
                        value="TUTOR"
                        class="peer sr-only"
                        {% if selected_role == 'TUTOR' %}checked{% endif %}
                    >
                    <span class="block text-center border border-slate-200 rounded-lg p-3 text-sm
                        text-slate-700 hover:bg-slate-50
                        peer-checked:bg-navy peer-checked:text-white
                        peer-checked:border-navy">
                        👨‍🏫 Tutor
                    </span>
                </label>

                <!-- Admin -->
                <label class="cursor-pointer">
                    <input
                        type="radio"
                        name="role"
                        value="ADMIN"
                        class="peer sr-only"
                        {% if selected_role == 'ADMIN' %}checked{% endif %}
                    >
                    <span class="block text-center border border-slate-200 rounded-lg p-3 text-sm
                        text-slate-700 hover:bg-slate-50
                        peer-checked:bg-navy peer-checked:text-white
                        peer-checked:border-navy">
                        ⚙️ Admin
                    </span>
                </label>

            </div>

            <!-- Username or Email -->
            <label
                for="email"
                class="block text-sm font-semibold text-slate-700 mb-2">
                Username or Email
            </label>

            <input
                type="text"
                id="email"
                name="email"
                value="{{ request.POST.email|default:'' }}"
                autocomplete="username"
                required
                placeholder="Enter username or email"
                class="w-full border border-slate-300 rounded-lg px-4 py-3 mb-4
                focus:outline-none focus:ring-2 focus:ring-indigoCustom
                focus:border-indigoCustom"
            >

            <!-- Password -->
            <label
                for="password"
                class="block text-sm font-semibold text-slate-700 mb-2">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
                placeholder="Enter password"
                class="w-full border border-slate-300 rounded-lg px-4 py-3 mb-5
                focus:outline-none focus:ring-2 focus:ring-indigoCustom
                focus:border-indigoCustom"
            >

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-navy text-white py-3 rounded-lg
                font-semibold hover:bg-indigoCustom transition duration-200">
                Log In
            </button>

        </form>

        <!-- Registration Link -->
        <p class="text-center text-sm text-slate-500 mt-6">
            Don't have an account?
            <a
                href="{% url 'register' %}"
                class="text-indigoCustom font-semibold hover:underline">
                Register here
            </a>
        </p>

        <!-- Security Note -->
        <p class="text-xs text-slate-400 text-center mt-4">
            Your account role is checked during login.
        </p>

    </div>

</body>
</html>
