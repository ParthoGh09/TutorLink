<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TutorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-4">

<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-blue-700">Create Account</h1>
        <a href="{% url 'login' %}" class="text-blue-600 text-sm">Log In</a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <p class="bg-red-100 text-red-700 p-3 rounded mb-4">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data" action="{% url 'register' %}">
        {% csrf_token %}

        <label class="block mb-2 font-semibold">Join as</label>
        <div class="flex gap-6 mb-4">
            <label>
                <input type="radio" name="role" value="STUDENT" checked
                       onclick="toggleRoleFields('STUDENT')">
                Student
            </label>

            <label>
                <input type="radio" name="role" value="TUTOR"
                       onclick="toggleRoleFields('TUTOR')">
                Tutor
            </label>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <input class="border p-3 rounded w-full" type="text"
                   name="full_name" placeholder="Full Name" required>

            <input class="border p-3 rounded w-full" type="email"
                   name="email" placeholder="Email" required>

            <input class="border p-3 rounded w-full" type="text"
                   name="phone" placeholder="Phone Number" required>

            <input class="border p-3 rounded w-full" type="password"
                   name="password" placeholder="Password" required>

            <input class="border p-3 rounded w-full" type="password"
                   name="confirm_password" placeholder="Confirm Password" required>
        </div>

        <div id="student-fields" class="mt-5 p-4 bg-gray-50 rounded">
            <h3 class="font-semibold text-blue-700 mb-3">Student Details</h3>

            <div class="grid md:grid-cols-3 gap-4">
                <input class="border p-3 rounded w-full" type="text"
                       name="institution" placeholder="Institution">

                <input class="border p-3 rounded w-full" type="text"
                       name="academic_level" placeholder="Academic Level">

                <input class="border p-3 rounded w-full" type="number"
                       name="monthly_budget" placeholder="Monthly Budget (৳)">
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-4 mt-4">
            <input class="border p-3 rounded w-full" type="text"
                   name="division" value="Dhaka" placeholder="Division">

            <input class="border p-3 rounded w-full" type="text"
                   name="district" value="Dhaka" placeholder="District">

            <input class="border p-3 rounded w-full" type="text"
                   name="area" placeholder="Preferred Area" required>
        </div>

        <textarea class="border p-3 rounded w-full mt-4"
                  name="bio" rows="3"
                  placeholder="Short Bio"></textarea>

        <label class="block mt-4 mb-2">Profile Picture (Optional)</label>
        <input type="file" name="profile_picture" accept="image/*">

        <p class="text-sm text-gray-500 mt-4">
            Your exact address stays private.
        </p>

        <button type="submit"
                class="w-full bg-blue-600 text-white p-3 rounded mt-4 hover:bg-blue-700">
            Continue to Verification
        </button>
    </form>
</div>

<script>
    function toggleRoleFields(role) {
        document.getElementById('student-fields').style.display =
            role === 'STUDENT' ? 'block' : 'none';
    }
</script>

</body>
</html>
