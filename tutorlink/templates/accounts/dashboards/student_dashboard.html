<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home | TutorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1F2A5C', indigoCustom: '#2E3C86', coral: '#FF6B5B',
                        mint: '#E7F8F1', sunshine: '#FBE77B', success: '#12A783'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-lora { font-family: 'Lora', serif; }
    </style>
</head>
<body class="bg-[#EEF1F8] text-navy min-h-screen">

    <header claas="bg-white flex items-center gap-4 px-6 py-3 shadow-sm">
        <div class="font-lora text-2xl">Tutor<span class="text-coral">Link</span></div>
        <div class="border rounded-xl px-3 py-1.5 text-sm">📍 {{ location }}</div>
        <input type="text" placeholder="Search tutors, posts, subjects..."
               class="flex-1 border rounded-xl px-4 py-2 text-sm">
        <div class="text-sm text-right">
            <div class="font-semibold">{{ user.get_full_name|default:user.username }}</div>
            <div class="text-xs text-gray-500">{{ role_name }}</div>
        </div>
    </header>

    <div class="flex gap-5 p-6">
        <!-- SIDEBAR -->
        <!-- MAIN -->
    </div>

</body>
</html>
