<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Tutors | TutorLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 32px 16px; background: #F1F4F9; color: #1F2A5C;
               font-family: 'Poppins', sans-serif; }
        .page { max-width: 1100px; margin: 0 auto; }
        .back { font-size: 13px; color: #FF6B5B; text-decoration: none; }
        h1 { font-family: 'Lora', serif; font-size: 30px; margin: 8px 0 4px; }
        .sub { font-size: 13px; color: #6B7390; margin-bottom: 20px; }

        .layout { display: flex; gap: 20px; align-items: flex-start; }
        .filters { width: 260px; background: #fff; border-radius: 20px; padding: 20px;
                   box-shadow: 0 10px 30px rgba(31, 42, 92, 0.08); }
        .filters label { display: block; font-size: 11px; font-weight: 600;
                         text-transform: uppercase; margin: 14px 0 6px; }
        .filters label:first-child { margin-top: 0; }
        .filters input, .filters select { width: 100%; box-sizing: border-box; padding: 10px 12px;
                         border: 1px solid #DDE2EE; border-radius: 10px;
                         font-family: inherit; font-size: 13px; }
        .btn { display: block; width: 100%; box-sizing: border-box; margin-top: 18px;
               background: #1F2A5C; color: #fff; border: 0; border-radius: 12px; padding: 12px;
               font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
        .reset { display: block; text-align: center; margin-top: 10px; font-size: 12px;
                 color: #FF6B5B; text-decoration: none; }

        .results { flex: 1; }
        .count { font-weight: 600; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="page">

    <a href="{% url 'student_dashboard' %}" class="back">← Back to Home</a>
    <h1>Find Tutors</h1>
    <div class="sub">Search verified tutors by subject, level, budget and area</div>

    <div class="layout">

        <form method="get" class="filters">
            <label>Search tutor</label>
            <input type="text" name="q" value="{{ filters.q }}" placeholder="Search by name...">

            <label>Subject</label>
            <select name="subject">
                <option value="">All subjects</option>
                {% for s in subjects %}
                <option value="{{ s.id }}" {% if filters.subject == s.id|stringformat:"d" %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>

            <label>Class level</label>
            <select name="class_level">
                <option value="">All levels</option>
                {% for n in class_levels %}
                <option value="{{ n }}" {% if filters.class_level == n|stringformat:"d" %}selected{% endif %}>Class {{ n }}</option>
                {% endfor %}
            </select>

            <label>Area</label>
            <input type="text" name="area" value="{{ filters.area }}" placeholder="e.g. Dhanmondi">

            <label>Max monthly budget (৳)</label>
            <input type="number" name="max_budget" value="{{ filters.max_budget }}" placeholder="e.g. 6000">

            <label>Teaching mode</label>
            <select name="mode">
                <option value="">Any</option>
                <option value="ONLINE" {% if filters.mode == 'ONLINE' %}selected{% endif %}>Online</option>
                <option value="OFFLINE" {% if filters.mode == 'OFFLINE' %}selected{% endif %}>Offline</option>
            </select>

            <label>Minimum rating</label>
            <select name="min_rating">
                <option value="">Any</option>
                <option value="4.0" {% if filters.min_rating == '4.0' %}selected{% endif %}>4.0 &amp; up</option>
                <option value="4.5" {% if filters.min_rating == '4.5' %}selected{% endif %}>4.5 &amp; up</option>
            </select>

            <button type="submit" class="btn">Apply Filters</button>
            <a href="{% url 'find_tutors' %}" class="reset">Reset</a>
        </form>

        <div class="results">
            <!-- RESULTS -->
        </div>

    </div>
</div>
</body>
</html>
